u2t:"Opuštanje",u2d:"Ulje lavande se široko koristi u aromaterapiji za ublažavanje stresa i bolji san.",
u3t:"U kuhinji",u3d:"Cvetovi i pupoljci su jestivi i u malim količinama daju ukus poslasticama, želeima i napicima.",
u4t:"Bašta i priroda",u4d:"Cvetovi bogati nektarom privlače pčele i leptire, a miris odbija moljce iz ormana.",
h_care:"Saveti za uzgoj",
care:"Lavandu sadite na punom suncu u dobro dreniranom zemljištu. Klasove berite pred podne, kada se rosa osuši i prvi pupoljci se otvore. Sušite ih u malim svežnjevima na senovitom, provetrenom mestu.",
h_fun:"Zanimljivosti",
f1:"Rod Lavandula obuhvata oko 47 vrsta i preko 400 imenovanih sorti.",
f2:"Stari Rimljani su koristili lavandu u kupatilima; ime se obično povezuje sa latinskim ‚lavare‘ (prati).",
f3:"Ulje lavande se dobija destilacijom cvetova; među glavnim mirisnim sastojcima su linalol i linalil-acetat.",
f4:"Osušeni cvetovi se odavno stavljaju u kesice da miomirišu sanduke i ormane.",
warn:"⚠️ Etarsko ulje lavande ne zamenjuje lek. Izbegavajte ga u trudnoći ili dojenju bez saveta lekara i razblažite pre nanošenja na kožu.",
foot:"Skeniraj. Pomirišи. Otkrij. — Demo stranica biljke".replace("Pomirišи","Pomiriši")}
};
const titles={en:"Lavender",de:"Lavendel",it:"Lavanda",el:"Λεβάντα",sr:"Lavanda"};
const supported=Object.keys(T);

function setLang(l){
  if(!T[l]) l="en";
  document.documentElement.lang=l;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=T[l][el.dataset.i18n]??el.textContent});
  document.querySelectorAll(".lang-bar button").forEach(b=>b.classList.toggle("active",b.dataset.lang===l));
  document.title=titles[l]+" · Lavandula angustifolia";
  try{localStorage.setItem("lang",l)}catch(e){}
  const u=new URL(location);u.searchParams.set("lang",l);history.replaceState(null,"",u);
}
document.querySelectorAll(".lang-bar button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));

const q=new URLSearchParams(location.search).get("lang");
let saved=null;try{saved=localStorage.getItem("lang")}catch(e){}
const nav=(navigator.language||"en").slice(0,2).toLowerCase();
setLang(supported.includes(q)?q:supported.includes(saved)?saved:supported.includes(nav)?nav:"en");

const hero=document.getElementById("hero");
const img=new Image();
img.onload=()=>{hero.style.backgroundImage="url('"+img.src+"')"};
img.src="https://commons.wikimedia.org/wiki/Special:FilePath/Lavandula_angustifolia_lavender_Lavendel_02.jpg?width=1600";

document.querySelectorAll("img[loading]").forEach(i=>i.addEventListener("error",()=>{i.style.visibility="hidden";i.parentElement.style.minHeight="120px"}));

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("show");io.unobserve(e.target)}}),{threshold:.1});
document.querySelectorAll(".fade").forEach(s=>io.observe(s));
</script>
</body>
</html>
